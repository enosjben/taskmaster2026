/* ─────────────────────────────────────────────────────────────
   A task envelope on the Taskmaster's desk. Committed to a single
   light world on purpose: this is a printed sheet under a lamp,
   not a UI that should invert. Colour is reserved for the five
   teams and the wax — nothing else on the page is coloured.
   ───────────────────────────────────────────────────────────── */
:root{
  --desk:       #6B4526;
  --desk-deep:  #35200F;
  --paper:      #F4EFE3;
  --paper-warm: #EDE6D6;
  --paper-edge: #DCD3BE;
  --ink:        #1A1714;
  --ink-soft:   #4A4238;
  --pencil:     #8B8071;
  --rule:       #C7BCA4;
  --rule-soft:  #DFD6C2;
  --wax:        #B4241C;
  --wax-hi:     #D8483C;
  --wax-lo:     #7C120D;

  --red-tab:    #D23A2E;  --red-ink:    #A82A20;
  --yel-tab:    #EFC01E;  --yel-ink:    #8A6408;
  --grn-tab:    #4C9A45;  --grn-ink:    #37702F;
  --blu-tab:    #3A72BC;  --blu-ink:    #2B5391;
  --pur-tab:    #8C55A8;  --pur-ink:    #6A3D85;

  --slab: "Bevan", Rockwell, Clarendon, "Bookman Old Style", Georgia, serif;
  --type: "Veteran Typewriter", "Courier New", ui-monospace, monospace;

  --gap: clamp(12px, 1.4vw, 22px);
}

*{ box-sizing:border-box; }

html{ background:var(--desk-deep); }

body{
  margin:0;
  min-height:100vh;
  font-family:var(--type);
  color:var(--ink);
  /* Lamp-lit desk: warm pool of light, dark corners, faint grain. */
  background:
    repeating-linear-gradient(94deg, rgba(0,0,0,.05) 0 2px, rgba(255,255,255,.02) 2px 5px, rgba(0,0,0,0) 5px 11px),
    radial-gradient(120% 70% at 50% -5%, rgba(255,214,150,.30) 0%, rgba(255,214,150,0) 60%),
    radial-gradient(90% 80% at 50% 40%, #7A5230 0%, #4E3018 60%, #2C1A0C 100%),
    var(--desk);
  -webkit-font-smoothing:antialiased;
  padding:clamp(12px, 2.4vw, 44px);
}

/* ── The sheet ────────────────────────────────────────────── */
.sheet{
  position:relative;
  max-width:1500px;
  margin:0 auto;
  background:
    radial-gradient(80% 40% at 20% 0%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
    linear-gradient(180deg, var(--paper) 0%, var(--paper) 70%, var(--paper-warm) 100%);
  box-shadow:
    0 2px 0 rgba(255,255,255,.35) inset,
    0 24px 60px -18px rgba(0,0,0,.62),
    0 4px 12px rgba(0,0,0,.34);
  padding:clamp(18px, 2.6vw, 40px) clamp(16px, 2.8vw, 46px) clamp(28px, 3vw, 48px);
  display:flex;
  flex-direction:column;
  gap:clamp(20px, 2.6vw, 38px);
}

/* ── Envelope masthead ────────────────────────────────────── */
.envelope{
  position:relative;
  border:1px solid var(--paper-edge);
  background:linear-gradient(180deg, #FBF7EE 0%, #F1EADC 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  /* the deep bottom padding is the envelope flap: it keeps the credits
     clear of the crease and gives the wax somewhere to sit */
  padding:clamp(20px, 3vw, 38px) clamp(16px, 3vw, 40px) clamp(74px, 8vw, 116px);
  text-align:center;
}
/* the flap crease the wax seal sits on */
.envelope::after{
  content:"";
  position:absolute;
  left:0; right:0;
  bottom:clamp(28px, 3.4vw, 44px);
  border-top:1px solid var(--paper-edge);
  box-shadow:0 1px 0 rgba(255,255,255,.85);
}

h1{
  margin:0;
  font-family:var(--type);
  /* the face ships in one weight; the browser's synthetic bold is what gives
     the wordmark its stamped heft */
  font-weight:700;
  font-size:clamp(34px, 7.4vw, 104px);
  line-height:1;
  letter-spacing:.055em;
  text-transform:uppercase;
  color:var(--ink);
  text-wrap:balance;
  /* letterpress bite */
  text-shadow:0 1px 0 rgba(255,255,255,.6), 0 -1px 0 rgba(0,0,0,.12);
}
h1{ user-select:none; -webkit-user-select:none; }

.flap{
  position:absolute;
  left:0; right:0;
  bottom:clamp(28px, 3.4vw, 44px);
  transform:translateY(50%);
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(10px, 1.6vw, 24px);
  font-size:clamp(10px, 1vw, 12.5px);
  color:var(--ink-soft);
  z-index:2;
}
/* ── Wax seal ─────────────────────────────────────────────── */
.wax{
  position:relative;
  flex:0 0 auto;
  width:clamp(66px, 7.4vw, 104px);
  height:clamp(66px, 7.4vw, 104px);
  transform:rotate(-3deg);
  display:grid;
  place-items:center;
  /* pressed wax, not a bauble: flat centre, thickened irregular rim */
  border-radius:46% 54% 47% 53% / 52% 46% 54% 48%;
  background:
    radial-gradient(72% 72% at 50% 46%, #C22C22 0%, #B4241C 58%, rgba(180,36,28,0) 72%),
    radial-gradient(100% 100% at 50% 50%, rgba(140,22,16,0) 52%, #9B1B14 78%, #7C120D 100%),
    var(--wax);
  box-shadow:
    0 4px 9px rgba(0,0,0,.34),
    0 1px 2px rgba(0,0,0,.28),
    inset 0 2px 5px rgba(255,150,140,.28),
    inset 0 -4px 9px rgba(96,12,8,.45);
}
/* the die's dividing rule, pressed between the two initials */
.wax::before{
  content:"";
  position:absolute;
  top:17%;
  bottom:17%;
  left:50%;
  width:2px;
  transform:translateX(-50%);
  background:#7A130E;
  box-shadow:1px 0 0 rgba(255,158,146,.34), -1px 0 0 rgba(72,6,3,.4);
  border-radius:1px;
}
.wax span{
  font-family:var(--slab);
  font-size:clamp(20px, 2.3vw, 32px);
  letter-spacing:.42em;
  text-indent:.42em;
  color:#7A130E;
  user-select:none;
  -webkit-user-select:none;
  /* embossed: light catches the top edge, shadow falls below */
  text-shadow:0 -1px 0 rgba(72,6,3,.75), 0 1px 0 rgba(255,158,146,.5);
}

/* ── Buttons ──────────────────────────────────────────────── */
.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  appearance:none;
  background:transparent;
  border:1px solid var(--rule);
  border-radius:1px;
  color:var(--ink-soft);
  font-family:var(--type);
  font-size:11px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
  padding:9px 16px;
  cursor:pointer;
  transition:color .16s, border-color .16s, background-color .16s;
  white-space:nowrap;
  user-select:none;
  -webkit-user-select:none;
}
.btn:hover{ color:var(--ink); border-color:var(--ink-soft); background:rgba(0,0,0,.04); }
.btn:focus-visible{ outline:2px solid var(--wax); outline-offset:3px; }
.btn.danger:hover{ color:var(--wax); border-color:var(--wax); background:rgba(180,36,28,.07); }
/* armed and waiting for the second press */
.btn.armed, .btn.danger.armed:hover{
  color:#FFF6EE;
  border-color:var(--wax);
  background:var(--wax);
}

/* the attribute alone loses to the class's display, so say it explicitly */
.link[hidden]{ display:none; }
.link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-family:var(--type);
  font-size:11px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--grn-ink);
}
.link::before{
  content:"";
  width:8px; height:8px;
  border-radius:50%;
  background:var(--grn-tab);
  box-shadow:0 0 0 3px rgba(76,154,69,.2);
}
.link[data-state="lost"]{ color:var(--pencil); }
.link[data-state="lost"]::before{ background:var(--pencil); box-shadow:none; }

/* ── Standings: five filing cards ─────────────────────────── */
.standings{
  display:flex;
  gap:var(--gap);
  align-items:stretch;
}

/* One declaration for both the standings cards and the home ones: the frame
   is an inlined image, so a second copy would weigh as much as the first. */
.card, .home-card{
  background:linear-gradient(180deg, #FCFAF4 0%, #F3EDE0 100%);
  /* keep the paper out from under the moulding */
  background-clip:padding-box;
  /* the gilt frame: nine-sliced so the mitred corners stay carved and the

  box-shadow:inset 0 0 0 3px var(--tab), 0 2px 7px rgba(0,0,0,.3);
}
.card{
  flex:1 1 0;
  min-width:0;
  position:relative;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:clamp(10px, 1.1vw, 16px);
  will-change:transform;
}
.card.lead{
  box-shadow:inset 0 0 0 3px var(--tab), 0 5px 18px rgba(0,0,0,.42);
}

.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:clamp(28px, 3vw, 40px);
}

/* the golden head goes to whoever is winning */
.trophy{
  width:clamp(28px, 3vw, 40px);
  height:auto;
  opacity:0;
  transform:translateY(3px) scale(.8);
  transition:opacity .3s, transform .3s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.4)) drop-shadow(0 0 .5px rgba(120,78,14,.9));
}
.card.lead .trophy{ opacity:1; transform:none; }

/* only once every task has been judged is anyone actually the champion */
.champion-stamp{
  position:absolute;
  right:clamp(8px, 1vw, 14px);
  bottom:clamp(10px, 1.2vw, 18px);
  font-family:var(--type);
  font-size:clamp(8px, .85vw, 11px);
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--wax);
  border:2px solid var(--wax);
  border-radius:2px;
  padding:3px 7px;
  transform:rotate(-9deg) scale(1.5);
  opacity:0;
  pointer-events:none;
  transition:opacity .35s, transform .35s cubic-bezier(.2,.8,.2,1);
}
.card.champion .champion-stamp{ opacity:.85; transform:rotate(-9deg) scale(1); }

.team-name{
  font-family:var(--slab);
  font-size:clamp(16px, 2vw, 30px);
  line-height:1.04;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--tint);
  word-break:break-word;
  min-width:0;
}
.team-name:focus-visible{ outline:2px solid var(--wax); outline-offset:3px; }

.roster{
  font-family:var(--type);
  font-size:clamp(10px, .92vw, 12.5px);
  line-height:1.55;
  color:var(--ink-soft);
  min-height:1.55em;
}
.roster.is-empty::before{
  content:"add players";
  color:var(--pencil);
  opacity:.75;
}
.roster:focus-visible{ outline:2px solid var(--wax); outline-offset:3px; }

.total-row{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:auto;
  padding-top:6px;
}
/* the running total sits on its own blob of wax, like the show's scoreboard */
.score-seal{
  position:relative;
  display:grid;
  place-items:center;
  width:clamp(62px, 8vw, 104px);
  height:clamp(54px, 7vw, 92px);
  transform:rotate(-2deg);
  border-radius:47% 53% 45% 55% / 53% 46% 54% 47%;
  background:
    radial-gradient(72% 72% at 50% 44%, #C22C22 0%, #B4241C 58%, rgba(180,36,28,0) 72%),
    radial-gradient(100% 100% at 50% 50%, rgba(140,22,16,0) 50%, #9B1B14 78%, #7C120D 100%),
    var(--wax);
  box-shadow:
    0 3px 7px rgba(0,0,0,.32),
    inset 0 2px 5px rgba(255,150,140,.26),
    inset 0 -4px 9px rgba(96,12,8,.45);
}
.total{
  font-family:var(--slab);
  font-size:clamp(24px, 3.4vw, 44px);
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:#FFF3E8;
  text-shadow:0 -1px 0 rgba(90,10,6,.55), 0 2px 2px rgba(60,6,4,.45);
}

/* ── Home: who is playing, before anything is scored ──────── */
.home[hidden], .board-view[hidden]{ display:none; }
.board-view{
  display:flex;
  flex-direction:column;
  gap:clamp(20px, 2.6vw, 38px);
}
.home{ display:flex; flex-direction:column; gap:clamp(12px, 1.6vw, 22px); }
.home-teams{ display:flex; gap:var(--gap); align-items:stretch; }
.home-card{
  flex:1 1 0;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:clamp(8px, 1vw, 14px);
  padding:clamp(12px, 1.3vw, 20px);
}
/* Two lines' worth of room whether the name needs one or two, so the rule
   under it — and every player list — starts at the same height across all
   five frames however narrow the window gets. */
.home-name{
  font-family:var(--slab);
  font-size:clamp(17px, 1.9vw, 30px);
  line-height:1.15;
  min-height:2.3em;
  display:flex;
  align-items:center;
  justify-content:center;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--tint);
  word-break:break-word;
  text-align:center;
}
.home-name:focus-visible{ outline:2px solid var(--wax); outline-offset:3px; }
.roster-field{
  flex:1 1 auto;
  min-height:5em;
  width:100%;
  resize:none;
  border:none;
  border-top:1px solid var(--rule-soft);
  padding:clamp(8px, .9vw, 12px) 0 0;
  background:transparent;
  color:var(--ink);
  font-family:var(--type);
  font-size:clamp(12px, 1.05vw, 16px);
  line-height:1.7;
  text-align:center;
}
.roster-field::placeholder{ color:var(--pencil); opacity:.75; }
.roster-field:focus-visible{ outline:2px solid var(--wax); outline-offset:2px; }

.home-foot{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.begin{
  appearance:none;
  border:none;
  border-radius:2px;
  background:var(--wax);
  color:#FFF6EE;
  font-family:var(--type);
  font-size:clamp(12px, 1.15vw, 15px);
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  padding:clamp(12px, 1.3vw, 18px) clamp(24px, 3vw, 44px);
  cursor:pointer;
  box-shadow:0 4px 14px -4px rgba(124,18,13,.7);
  user-select:none;
  -webkit-user-select:none;
  transition:transform .14s, box-shadow .14s;
}
.begin:hover{ transform:translateY(-1px); box-shadow:0 7px 18px -5px rgba(124,18,13,.8); }
.begin:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
.home-note{
  margin:0;
  font-family:var(--type);
  font-size:clamp(10px, .95vw, 12px);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--pencil);
}

/* ── Matrix ───────────────────────────────────────────────── */
.matrix-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.section-label{
  margin:0;
  font-family:var(--type);
  font-weight:700;
  font-size:clamp(10px, 1vw, 12px);
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--pencil);
}
.progress{
  margin:0;
  font-family:var(--type);
  font-size:clamp(10px, 1vw, 12px);
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}

.scroller{ overflow-x:auto; }

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:760px;
}

thead th{
  padding:0 0 10px;
  vertical-align:bottom;
  text-align:center;
  font-weight:400;
}
thead th:first-child{ text-align:left; }

.col-head{
  display:block;
  font-family:var(--slab);
  font-size:clamp(11px, 1.15vw, 16px);
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--tint);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.col-rule{ display:block; height:3px; background:var(--tab); margin-top:7px; }

tbody td{
  border-top:1px solid var(--rule-soft);
  padding:0;
  vertical-align:middle;
}
tbody tr:first-child td{ border-top:1px solid var(--rule); }
tbody tr:last-child td{ border-bottom:1px solid var(--rule); }

.task-cell{
  padding:12px 20px 12px 0;
  width:33%;
  min-width:250px;
}
.task-inner{ display:flex; align-items:baseline; gap:12px; }
.task-num{
  font-family:var(--slab);
  font-size:clamp(12px, 1.2vw, 17px);
  color:var(--pencil);
  font-variant-numeric:tabular-nums;
  min-width:1.5em;
}
.task-name{
  font-family:var(--type);
  font-weight:700;
  font-size:clamp(13px, 1.5vw, 20px);
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1.2;
}
.task-title.sealed{
  color:var(--pencil);
  letter-spacing:.22em;
  font-style:italic;
}
.task-flag{
  display:inline-block;
  margin-left:10px;
  font-family:var(--type);
  font-weight:700;
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--wax);
  border:1.5px solid var(--wax);
  border-radius:2px;
  padding:2px 6px;
  vertical-align:middle;
  white-space:nowrap;
  transform:rotate(-1.5deg);
}

.score-td{ text-align:center; padding:7px 6px; }

.cell{
  appearance:none;
  position:relative;
  width:100%;
  min-height:50px;
  border:1px solid transparent;
  border-radius:1px;
  background:rgba(0,0,0,.022);
  color:var(--pencil);
  font-family:var(--slab);
  font-size:clamp(19px, 2.1vw, 30px);
  font-variant-numeric:tabular-nums;
  line-height:1;
  cursor:pointer;
  transition:background-color .2s, border-color .2s, color .2s;
}
.cell:hover{ border-color:var(--pencil); }
.cell:focus-visible{ outline:2px solid var(--wax); outline-offset:2px; }
.cell.scored{
  color:var(--tint);
  background:color-mix(in srgb, var(--tab) calc(var(--a) * 20%), transparent);
  border-color:color-mix(in srgb, var(--tab) calc(var(--a) * 34%), transparent);
}
/* the winner of each task gets circled, the way you would on paper */
.cell.best::after{
  content:"";
  position:absolute;
  inset:2px 8px;
  border:2px solid var(--tab);
  border-radius:50%;
  transform:rotate(-4deg);
  opacity:.9;
  pointer-events:none;
}
.cell.stamped{ animation:stamp .32s cubic-bezier(.2,.8,.2,1); }
@keyframes stamp{
  0%{ transform:scale(1.24) rotate(-3deg); opacity:.4; }
  55%{ transform:scale(.97) rotate(.6deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}

tfoot td{ padding-top:14px; }
.foot-total{
  text-align:center;
  font-family:var(--slab);
  font-size:clamp(17px, 1.9vw, 26px);
  font-variant-numeric:tabular-nums;
  color:var(--tint);
}
.foot-label{ padding-right:20px; }

/* ── Popover ──────────────────────────────────────────────── */
.pop-menu{
  position:fixed;
  z-index:50;
  display:none;
  flex-direction:column;
  gap:4px;
  padding:6px;
  background:#FBF8F0;
  border:1px solid var(--rule);
  box-shadow:0 14px 30px -10px rgba(0,0,0,.5);
}
.pop-menu.open{ display:flex; }
.pop-grid{ display:grid; grid-template-columns:repeat(var(--cols, 7), 42px); gap:4px; }
.pop-custom{ display:flex; gap:4px; }
.pop-custom input{
  flex:1 1 auto;
  min-width:0;
  height:40px;
  padding:0 10px;
  border:1px solid var(--rule);
  border-radius:1px;
  background:#FFFDF7;
  color:var(--ink);
  font-family:var(--slab);
  font-size:17px;
  text-align:center;
}
.pop-custom input::placeholder{
  font-family:var(--type);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--pencil);
}
.pop-custom input:focus-visible{ outline:2px solid var(--wax); outline-offset:1px; }
.pop-custom .go{
  width:auto;
  height:40px;
  padding:0 14px;
  font-family:var(--type);
  font-size:11px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.pop-menu button{
  appearance:none;
  width:42px; height:42px;
  border:1px solid var(--rule-soft);
  border-radius:1px;
  background:#FFFDF7;
  color:var(--ink);
  font-family:var(--slab);
  font-size:19px;
  cursor:pointer;
  transition:background-color .14s, color .14s, border-color .14s;
}
.pop-menu button:hover{ background:var(--pop-tab, var(--ink)); color:#FFFDF7; border-color:transparent; }
.pop-menu button:focus-visible{ outline:2px solid var(--wax); outline-offset:2px; }
.pop-menu button.clear{ color:var(--pencil); font-family:var(--type); font-size:22px; }

/* ── Big screen ───────────────────────────────────────────────
   Built for a 1920x1080 TV: the whole board fits the viewport with
   nothing to scroll. Everything is sized in vh so it holds at any
   16:9 screen, and the grid takes whatever height is left over.
   Narrow or short windows keep the scrolling layout above.
   ───────────────────────────────────────────────────────────── */
@media (min-width:1100px) and (min-height:620px){
  html, body{ height:100%; }
  body{ overflow:hidden; padding:1.3vh 1.1vw; }

  .sheet{
    max-width:none;
    height:100%;
    gap:1.2vh;
    padding:1.7vh 1.6vw 1.3vh;
  }

  .envelope{ padding:1.4vh 2vw 5vh; }
  h1{ font-size:6.2vh; letter-spacing:.05em; }
  .flap{ bottom:2.6vh; }
  .envelope::after{ bottom:2.6vh; }
  .wax{ width:7.6vh; height:7.6vh; }
  .wax span{ font-size:2.1vh; }

  /* out of the vertical flow entirely — the board owns the height */
  .controls{
    position:absolute;
    top:2.4vh;
    right:2.4vw;
    z-index:3;
    margin:0;
  }
  .btn{ font-size:1.05vh; padding:.75vh .7vw; letter-spacing:.14em; }

  .board-view{ flex:1 1 auto; min-height:0; gap:1.2vh; }
  .home{ flex:1 1 auto; min-height:0; gap:1.6vh; }
  .home-teams{ flex:1 1 auto; min-height:0; gap:.85vw; }
  .home-card{ padding:1.6vh 1vw; gap:1.2vh; border-width:2.3vh; }
  .home-name{ font-size:2.6vh; }
  .roster-field{ font-size:2.7vh; line-height:1.95; padding-top:1.4vh; }
  .begin{ font-size:1.5vh; padding:1.8vh 3.4vw; }
  .home-note{ font-size:1.25vh; }

  .standings{ flex:0 0 auto; gap:.85vw; }
  .card{ padding:1.1vh .8vw; gap:.6vh; border-width:2.3vh; }
  .card-top{ min-height:3.6vh; }
  .trophy{ width:3.7vh; }
  .team-name{ font-size:2.1vh; }
  .roster{ font-size:1.45vh; min-height:1.5em; }
  .score-seal{ width:8.4vh; height:7.2vh; }
  .total{ font-size:3.4vh; }
  .champion-stamp{ font-size:1.15vh; right:.8vw; bottom:1.2vh; }

  /* the grid absorbs whatever height the rest leaves behind */
  .matrix-section{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .matrix-head{ margin-bottom:.6vh; }
  .section-label, .progress{ font-size:1.3vh; }
    .scroller{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;   /* a safety valve, not the normal case */
    display:flex;
    flex-direction:column;
  }
  /* grows to fill the leftover height, so the nine rows space themselves
     evenly down the screen instead of bunching at the top */
  table{ flex:1 1 auto; height:auto; min-width:0; }

  thead th{ padding-bottom:.9vh; }
  .col-head{ font-size:1.85vh; }
  .col-rule{ height:.32vh; margin-top:.7vh; }

  .task-cell{ padding:.4vh 1.4vw .4vh 0; min-width:0; width:32%; }
  .task-inner{ gap:.9vw; }
  .task-num{ font-size:1.75vh; }
  .task-name{ font-size:2.4vh; }
  .task-flag{ font-size:1.1vh; padding:.2vh .5vw; }

  .score-td{ padding:.3vh .3vw; }
  .cell{ min-height:0; height:100%; font-size:3.1vh; }

  tfoot td{ padding-top:.7vh; }
  .foot-total{ font-size:2.4vh; }
}

@media (max-width:900px){
  .standings{ flex-wrap:wrap; }
  .card{ flex:1 1 45%; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>

<script>
(function(){
  "use strict";

  var TASKS = [
    { name:"Longest Line" },
    { name:"Coolest Phone Photo" },
    { name:"Recreate Phone Photo" },
    { name:"Treasure Hunt" },
    { name:"Hit Song" },
    { name:"Museum Piece", flag:"Prize task" },
    { name:"Painting" },
    { name:"Commercial" },
    { name:"Relay", flag:"Finale", max:15, open:true }
  ];

  // Every task is out of five unless it says otherwise. An "open" task shows
  // buttons up to its max but accepts any number typed in, in case a finale
  // runs away with itself.
  var OPEN_LIMIT = 999;
  TASKS.forEach(function(t){ if(!t.max) t.max = 5; });

  function limitFor(r){ return TASKS[r].open ? OPEN_LIMIT : TASKS[r].max; }

  var TEAMS = [
    { name:"Red Team",    tab:"var(--red-tab)", tint:"var(--red-ink)",
      roster:"Becky\nMichael\nAurora\nLynn" },
    { name:"Yellow Team", tab:"var(--yel-tab)", tint:"var(--yel-ink)",
      roster:"Ben\nKiera\nCandace\nFelicity" },
    { name:"Green Team",  tab:"var(--grn-tab)", tint:"var(--grn-ink)",
      roster:"Josh\nElena\nJenson\nDaniel" },
    { name:"Blue Team",   tab:"var(--blu-tab)", tint:"var(--blu-ink)",
      roster:"Stefanie\nJason\nGlenn" },
    { name:"Purple Team", tab:"var(--pur-tab)", tint:"var(--pur-ink)",
      roster:"Ronnie\nAshley\nRoe" }
  ];

  // Names saved before "Team" was appended are treated as untouched defaults,
  // so an earlier session's storage does not pin the old wording.
  var LEGACY_NAMES = ["Red", "Yellow", "Green", "Blue", "Purple"];

  var NT = TASKS.length, NP = TEAMS.length;
  var KEY = "taskmaster-scoreboard-v1";
  var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function emptyScores(){
    return TASKS.map(function(){ return TEAMS.map(function(){ return null; }); });
  }

  function blank(){
    return {
      title:"Taskmaster",
      seal:"BE",
      teams:TEAMS.map(function(t){ return { name:t.name, roster:t.roster || "" }; }),
      scores:emptyScores()
    };
  }

  function load(){
    var fresh = blank();
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return fresh;
      var saved = JSON.parse(raw);
      if(typeof saved.title === "string") fresh.title = saved.title;
      if(typeof saved.seal === "string" && saved.seal) fresh.seal = saved.seal;
      if(Array.isArray(saved.teams)){
        saved.teams.slice(0, NP).forEach(function(t, i){
          if(!t) return;
          if(typeof t.name === "string" && t.name !== LEGACY_NAMES[i]) fresh.teams[i].name = t.name;
          // An empty stored roster means nobody ever filled one in, so it must
          // not wipe the squad the page ships with.
          if(typeof t.roster === "string" && t.roster.trim()) fresh.teams[i].roster = t.roster;
        });
      }
      if(Array.isArray(saved.scores)){
        saved.scores.slice(0, NT).forEach(function(row, r){
          if(!Array.isArray(row)) return;
          row.slice(0, NP).forEach(function(v, c){
            fresh.scores[r][c] = (typeof v === "number" && v >= 0 && v <= limitFor(r)) ? v : null;

      }
    }catch(e){ /* unreadable or corrupt storage: start clean rather than fail */ }
    return fresh;
  }

  // When the page is served by server.py the night lives on the server, so the
  // phone remote and this board stay in step. Opened straight from disk there
  // is no server to find, and local storage keeps the night exactly as before.
  var sync = { on:false, ownRev:-1, timer:null };

  function save(){
    if(sync.on){ push(); return; }
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  function push(){
    clearTimeout(sync.timer);
    sync.timer = setTimeout(function(){
      fetch("api/state", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          title:state.title, seal:state.seal,
          teams:state.teams, scores:state.scores
        })
      })
      .then(function(r){ return r.json(); })
      .then(function(res){ sync.ownRev = res.rev; })
      .catch(function(){});
    }, 120);
  }

  var state = load();

  function players(roster){
    return (roster || "").split(/[\n,]+/).map(function(n){ return n.trim(); })
                         .filter(function(n){ return n.length; });
  }

  function totalFor(team){
    return state.scores.reduce(function(sum, row){ return sum + (row[team] || 0); }, 0);
  }

  function bindEditable(el, commit){
    el.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); el.blur(); }
    });
    el.addEventListener("paste", function(ev){
      ev.preventDefault();
      var text = ((ev.clipboardData || window.clipboardData).getData("text") || "").replace(/\s+/g, " ");
      document.execCommand("insertText", false, text);
    });
    el.addEventListener("input", function(){ commit(el.textContent.trim()); });
  }

  /* ── Standings cards ────────────────────────────────────── */
  var standings = document.getElementById("standings");
  var headEls = [], footEls = [], cells = [], taskTitles = [];

  var cards = TEAMS.map(function(team, i){
    var card = document.createElement("article");
    card.className = "card";
    card.style.setProperty("--tab", team.tab);
    card.style.setProperty("--tint", team.tint);
    card.innerHTML =
      '<div class="card-top">' +
        '<div class="team-name" contenteditable="true" spellcheck="false" role="textbox" aria-label="Team name"></div>' +
        '<svg class="trophy" viewBox="0 0 24 30" role="img" aria-label="Holds the golden head"><use href="#golden-head"/></svg>' +
      '</div>' +
      '<div class="roster" contenteditable="true" spellcheck="false" role="textbox" aria-label="Players"></div>' +
      '<div class="total-row"><span class="score-seal"><span class="total">0</span></span></div>' +
      '<span class="champion-stamp">Champion</span>';

    var nameEl = card.querySelector(".team-name");
    var rosterEl = card.querySelector(".roster");
    nameEl.textContent = state.teams[i].name;
    rosterEl.textContent = players(state.teams[i].roster).join(", ");
    rosterEl.classList.toggle("is-empty", !state.teams[i].roster);

    bindEditable(nameEl, function(text){
      state.teams[i].name = text;
      save();
      headEls[i].textContent = text || TEAMS[i].name;
    });
    bindEditable(rosterEl, function(text){
      state.teams[i].roster = text;
      rosterEl.classList.toggle("is-empty", !text);
      save();
    });

    standings.appendChild(card);
    return card;

  /* ── Matrix ─────────────────────────────────────────────── */
  var headRow = document.getElementById("matrix-head");
  var body = document.getElementById("matrix-body");
  var foot = document.getElementById("matrix-foot");

  TASKS.forEach(function(task, r){

  /* ── Score entry ────────────────────────────────────────── */
  var pop = document.getElementById("pop");
  var popTarget = null;

  // Rebuilt on open: the finale runs 0-15 while every other task runs 0-5,
  // and an open task also gets a field for a score beyond its buttons.
  var popFirst = null;

  function buildMenu(r){
    var max = TASKS[r].max;
    pop.innerHTML = "";
    popFirst = null;

    var grid = document.createElement("div");
    grid.className = "pop-grid";
    grid.style.setProperty("--cols", Math.min(max + 2, 6));
    for(var n = max; n >= 0; n--){
      (function(value){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = value;
        b.addEventListener("click", function(){ commit(value); });
        grid.appendChild(b);
        if(!popFirst) popFirst = b;
      })(n);
    }
    var clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.className = "clear";
    clearBtn.textContent = "\u00D7";
    clearBtn.title = "Clear";
    clearBtn.addEventListener("click", function(){ commit(null); });
    grid.appendChild(clearBtn);
    pop.appendChild(grid);

    if(TASKS[r].open){
      var row = document.createElement("div");
      row.className = "pop-custom";

      var field = document.createElement("input");
      field.type = "text";
      field.inputMode = "numeric";
      field.autocomplete = "off";
      field.placeholder = "or type any score";
      field.setAttribute("aria-label", "Type any score");
      var existing = state.scores[r][popTarget ? popTarget.c : 0];
      field.value = (typeof existing === "number") ? existing : "";

      var go = document.createElement("button");
      go.type = "button";
      go.className = "go";
      go.textContent = "Set";

      function commitField(){
        var digits = field.value.replace(/[^0-9]/g, "");
        if(!digits){ commit(null); return; }
        commit(Math.min(OPEN_LIMIT, parseInt(digits, 10)));
      }

      field.addEventListener("input", function(){
        field.value = field.value.replace(/[^0-9]/g, "").slice(0, 3);
      });
      field.addEventListener("keydown", function(ev){
        ev.stopPropagation();                 // Escape/digits belong to the field
        if(ev.key === "Enter"){ ev.preventDefault(); commitField(); }
        else if(ev.key === "Escape"){ closeMenu(true); }
      });
      go.addEventListener("click", commitField);

      row.appendChild(field);
      row.appendChild(go);
      pop.appendChild(row);
    }
  }

  function openMenu(btn, r, c, tab){
    popTarget = { r:r, c:c, btn:btn };
    buildMenu(r);
    pop.style.setProperty("--pop-tab", tab);
    pop.classList.add("open");
    var rect = btn.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), window.innerWidth - w - 8);
    var top = rect.bottom + 8;
    if(top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 8);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
    if(popFirst) popFirst.focus();
  }

  function closeMenu(refocus){
    if(!pop.classList.contains("open")) return;
    pop.classList.remove("open");
    if(refocus && popTarget) popTarget.btn.focus();
    popTarget = null;
  }

  function commit(value){
    if(!popTarget) return;
    setScore(popTarget.r, popTarget.c, value);
    closeMenu(true);
  }

  function setScore(r, c, value){
    state.scores[r][c] = value;
    save();
    if(!REDUCED && value !== null){
      var btn = cells[r][c];
      btn.classList.remove("stamped");
      void btn.offsetWidth;
      btn.classList.add("stamped");
    }
    render();
  }

  // Digits typed in quick succession on the same cell combine, so the finale
  // can be given 15 as "1" then "5" without a separate entry mode.
  var typed = { r:-1, c:-1, value:0, at:0 };

  function onCellKey(ev, r, c){
    if(ev.key >= "0" && ev.key <= "9"){
      ev.preventDefault();
      var max = limitFor(r);
      var digit = parseInt(ev.key, 10);
      var now = Date.now();
      var value = null;
      if(typed.r === r && typed.c === c && now - typed.at < 1200
         && typed.value * 10 + digit <= max){
        value = typed.value * 10 + digit;
      }else if(digit <= max){
        value = digit;
      }
      if(value === null) return;      // e.g. 7 on a task marked out of five
      typed = { r:r, c:c, value:value, at:now };
      setScore(r, c, value);
      return;
    }
    if(ev.key === "Backspace" || ev.key === "Delete"){
      ev.preventDefault();
      typed = { r:-1, c:-1, value:0, at:0 };
      setScore(r, c, null);
      return;
    }
    var dr = 0, dc = 0;
    if(ev.key === "ArrowUp") dr = -1;
    else if(ev.key === "ArrowDown") dr = 1;
    else if(ev.key === "ArrowLeft") dc = -1;
    else if(ev.key === "ArrowRight") dc = 1;
    else return;
    ev.preventDefault();
    cells[Math.min(Math.max(0, r + dr), NT - 1)][Math.min(Math.max(0, c + dc), NP - 1)].focus();
  }

  document.addEventListener("click", function(ev){
    if(pop.contains(ev.target)) return;
    if(popTarget && popTarget.btn === ev.target) return;
    closeMenu(false);
  }, true);
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape") closeMenu(true);
  });
  window.addEventListener("resize", function(){ closeMenu(false); });

  /* ── Render ─────────────────────────────────────────────── */
  function render(){
    var totals = TEAMS.map(function(_, i){ return totalFor(i); });
    var leadScore = Math.max.apply(null, totals);
    var anyScored = state.scores.some(function(row){
      return row.some(function(v){ return v !== null; });
    });
    var judged = 0;

    state.scores.forEach(function(row, r){
      var rowMax = -1, complete = true, started = false;
      row.forEach(function(v){
        if(v === null) complete = false;
        else { started = true; if(v > rowMax) rowMax = v; }
      });
      if(complete) judged++;

      // Nobody watching the TV learns what a task was until it is being scored.
      taskTitles[r].textContent = started ? TASKS[r].name : "Sealed";
      taskTitles[r].classList.toggle("sealed", !started);

      row.forEach(function(v, c){
        var btn = cells[r][c];
        if(v === null){
          btn.textContent = "·";
          btn.classList.remove("scored", "best");
          btn.style.removeProperty("--a");
        }else{
          btn.textContent = v;
          btn.classList.add("scored");
          btn.classList.toggle("best", rowMax > 0 && v === rowMax);
          btn.style.setProperty("--a", Math.min(1, v / TASKS[r].max).toFixed(2));
        }
      });
    });

    var order = totals.map(function(t, i){ return { i:i, total:t }; })
                      .sort(function(a, b){ return b.total - a.total; });

    cards.forEach(function(card, i){
      card.classList.toggle("lead", anyScored && totals[i] === leadScore);
      card.classList.toggle("champion", judged === NT && totals[i] === leadScore);
      card.querySelector(".total").textContent = totals[i];
      footEls[i].textContent = totals[i];
    });

    // The first score of the night puts the scoreboard up by itself.
    if(anyScored && view === "home") setView("board");

    document.getElementById("judged").textContent = judged;

    reorder(order);
  }

  // FLIP: the cards re-sort themselves the moment a score lands.
  function reorder(order){
    if(!cards[0].offsetParent) return;     // the board is not on screen
    var first = cards.map(function(c){ return c.getBoundingClientRect().left; });
    order.forEach(function(entry, idx){ cards[entry.i].style.order = idx; });
    if(REDUCED) return;
    var last = cards.map(function(c){ return c.getBoundingClientRect().left; });
    cards.forEach(function(card, i){
      var dx = first[i] - last[i];
      if(Math.abs(dx) < 1) return;
      card.style.transition = "none";
      card.style.transform = "translateX(" + dx + "px)";
      requestAnimationFrame(function(){
        card.style.transition = "transform .55s cubic-bezier(.2,.7,.2,1)";
        card.style.transform = "";
      });
    });
  }

  /* ── Title and controls ─────────────────────────────────── */
  // Fixed: they are part of the set, and nothing good comes of a guest
  // selecting the wordmark mid-party.
  var titleEl = document.getElementById("title");
  titleEl.textContent = state.title;

  var sealEl = document.getElementById("seal");
  sealEl.textContent = state.seal;

  // An embedded page is refused the Fullscreen API outright, and the request
  // rejects asynchronously, so a try/catch never sees it. Detect that up front
  // and name the key that does work instead of offering a dead button.
  var fsBtn = document.getElementById("fullscreen");
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || "");
  var FS_KEY = isMac ? "\u2303\u2318F" : "F11";
  var fsTimer = null;

  function fullscreenHint(){
    clearTimeout(fsTimer);
    fsBtn.textContent = "Press " + FS_KEY;
    fsBtn.title = "This page cannot request full screen where it is embedded. "
                + "Use your browser's own full-screen key.";
    fsTimer = setTimeout(function(){
      if(document.fullscreenEnabled) fsBtn.textContent = "Full screen";
    }, 4000);
  }

  if(!document.fullscreenEnabled) fullscreenHint();

  fsBtn.addEventListener("click", function(){
    if(document.fullscreenElement){
      document.exitFullscreen();
      return;
    }
    var el = document.documentElement;
    var request = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!document.fullscreenEnabled || !request){
      fullscreenHint();
      return;
    }
    var result;
    try{ result = request.call(el); }catch(e){ fullscreenHint(); return; }
    Promise.resolve(result).catch(fullscreenHint);
  });

  // A sandboxed page cannot open a modal: window.confirm is suppressed and
  // simply returns false, which silently swallowed the reset. The guard is a
  // two-step button instead, which needs nothing from the host page.
  var resetBtn = document.getElementById("reset");
  var resetArmed = false;
  var resetTimer = null;

  function disarmReset(){
    resetArmed = false;
    clearTimeout(resetTimer);
    resetBtn.textContent = "Reset scores";
    resetBtn.classList.remove("armed");
  }

  resetBtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    if(!resetArmed){
      resetArmed = true;
      resetBtn.textContent = "Confirm reset";
      resetBtn.classList.add("armed");
      resetTimer = setTimeout(disarmReset, 5000);
      return;
    }
    disarmReset();
    state.scores = emptyScores();
    setView("home");
    if(sync.on){
      fetch("api/reset", { method:"POST" })
        .then(function(r){ return r.json(); })
        .then(function(res){ sync.ownRev = res.rev; })
        .catch(function(){});
    }else{
      save();
    }
    render();
  });

  document.addEventListener("click", function(){ if(resetArmed) disarmReset(); });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape") disarmReset();
  });

  /* ── Home: who is playing ───────────────────────────────── */
  var homeEl = document.getElementById("home");
  var boardEl = document.getElementById("board-view");
  var viewBtn = document.getElementById("view");
  var homeNames = [], homeRosters = [];
  var view = "home";

  TEAMS.forEach(function(team, i){
    var card = document.createElement("article");
    card.className = "home-card";
    card.style.setProperty("--tab", team.tab);
    card.style.setProperty("--tint", team.tint);

    var name = document.createElement("div");
    name.className = "home-name";
    name.contentEditable = "true";
    name.spellcheck = false;
    name.setAttribute("role", "textbox");
    name.setAttribute("aria-label", "Team name");
    name.textContent = state.teams[i].name;
    bindEditable(name, function(text){
      state.teams[i].name = text;
      save();
      headEls[i].textContent = text || TEAMS[i].name;
      var cardName = cards[i].querySelector(".team-name");
      if(document.activeElement !== cardName) cardName.textContent = text;
    });

    var roster = document.createElement("textarea");
    roster.className = "roster-field";
    roster.spellcheck = false;
    roster.setAttribute("data-gramm", "false");
    roster.setAttribute("data-gramm_editor", "false");
    roster.setAttribute("data-enable-grammarly", "false");
    roster.rows = 5;
    roster.placeholder = "One name per line";
    roster.setAttribute("aria-label", state.teams[i].name + " players");
    roster.value = players(state.teams[i].roster).join("\n");
    roster.addEventListener("input", function(){
      state.teams[i].roster = roster.value;
      save();
      var cardRoster = cards[i].querySelector(".roster");
      cardRoster.textContent = players(roster.value).join(", ");
      cardRoster.classList.toggle("is-empty", !players(roster.value).length);
    });

    card.appendChild(name);
    card.appendChild(roster);
    document.getElementById("home-teams").appendChild(card);
    homeNames.push(name);
    homeRosters.push(roster);
  });

  function setView(next){
    view = next;
    homeEl.hidden = next !== "home";
    boardEl.hidden = next === "home";
    viewBtn.textContent = next === "home" ? "Scoreboard" : "Teams";
    if(next === "board") render();     // lay the cards out now they are visible
  }

  document.getElementById("begin").addEventListener("click", function(){ setView("board"); });
  viewBtn.addEventListener("click", function(){
    setView(view === "home" ? "board" : "home");
  });

  // Keep the home screen in step when the phone or another edit changes names.
  function syncHome(){
    state.teams.forEach(function(team, i){
      if(document.activeElement !== homeNames[i]) homeNames[i].textContent = team.name;
      if(document.activeElement !== homeRosters[i]){
        homeRosters[i].value = players(team.roster).join("\n");
      }
    });
  }

  /* ── The sound of a round landing ───────────────────────── */
  var audio = {
    on: true,
    unlocked: false,
    el: document.getElementById("sting"),
    btn: document.getElementById("sound"),
    hintTimer: null
  };

  try{
    if(localStorage.getItem("taskmaster-sound") === "off") audio.on = false;
  }catch(e){}

  if(audio.el) audio.el.volume = 0.9;

  function labelSound(){
    audio.btn.textContent = audio.on ? "Sound on" : "Sound off";
  }
  labelSound();

  function stopSting(){
    if(audio.lastSource){
      try{ audio.lastSource.stop(); }catch(e){}
      audio.lastSource = null;
    }
    if(audio.el){ audio.el.pause(); audio.el.currentTime = 0; }
  }

  function soundHint(){
    audio.btn.textContent = "Click for sound";
    clearTimeout(audio.hintTimer);
    audio.hintTimer = setTimeout(labelSound, 4000);
  }

  // Browsers refuse to play until the page has been interacted with. A silent
  // play/pause inside the first gesture is enough to earn the right.
  // An <audio> element can have programmatic playback quietly revoked after
  // the first go, which leaves later rounds silent. A running AudioContext
  // replays a decoded buffer as often as asked, so that is the main path and
  // the element is only the fallback.
  function ensureCtx(){
    if(!audio.ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ audio.ctx = new AC(); }catch(e){ return null; }
      audio.gain = audio.ctx.createGain();
      audio.gain.gain.value = 0.9;
      audio.gain.connect(audio.ctx.destination);
      if(audio.el && audio.el.src){
        fetch(audio.el.src)
          .then(function(r){ return r.arrayBuffer(); })
          .then(function(raw){
            return new Promise(function(resolve, reject){
              // The callback form is the one older Safari understands.
              var out = audio.ctx.decodeAudioData(raw, resolve, reject);
              if(out && out.then) out.then(resolve, reject);
            });
          })
          .then(function(decoded){ audio.buffer = decoded; })
          .catch(function(){});           // the element still covers us
      }
    }
    if(audio.ctx.state === "suspended") audio.ctx.resume();
    return audio.ctx;
  }

  function unlockAudio(){
    if(!audio.el || audio.unlocked) return;
    audio.unlocked = true;                 // claimed up front so nothing races it
    var wasMuted = audio.el.muted;
    audio.el.muted = true;
    var attempt;
    try{ attempt = audio.el.play(); }catch(e){ audio.el.muted = wasMuted; return; }
    var settle = function(){
      // A real sting may have been asked for on this same click; if so, leave
      // it running rather than pausing the thing we were unlocking for.
      if(!audio.wantPlay){
        audio.el.pause();
        audio.el.currentTime = 0;
      }
      audio.el.muted = wasMuted;
    };
    if(attempt && attempt.then) attempt.then(settle, function(){ audio.el.muted = wasMuted; });
    else settle();
  }

  // Every interaction, not just the first: if a browser suspends the context
  // while the party is running, the next click quietly revives it.
  function primeAudio(){ ensureCtx(); unlockAudio(); }
  document.addEventListener("click", primeAudio, true);
  document.addEventListener("keydown", primeAudio, true);

  var soundPressed = false;

  audio.btn.addEventListener("click", function(){
    // The label states what sound is doing, not what the press will do. Anyone
    // pressing it first time wants to hear something, not to mute — so the
    // opening press only plays, and toggling starts from the press after.
    if(!soundPressed && audio.on){
      soundPressed = true;
      playStamp();
      return;
    }

    soundPressed = true;
    audio.on = !audio.on;
    labelSound();
    try{ localStorage.setItem("taskmaster-sound", audio.on ? "on" : "off"); }catch(e){}
    if(audio.on) playStamp();          // so you can set the volume before guests arrive
    else stopSting();
  });

  function playStamp(){
    if(!audio.on) return;
    var ctx = ensureCtx();

    if(ctx && audio.buffer){
      if(ctx.state !== "running"){ soundHint(); return; }
      var source = ctx.createBufferSource();
      source.buffer = audio.buffer;
      source.connect(audio.gain);
      source.start();
      audio.lastSource = source;
      return;
    }

    if(!audio.el) return;
    audio.wantPlay = true;
    audio.el.muted = false;                // the unlock may have left it muted
    try{
      audio.el.currentTime = 0;
      var played = audio.el.play();
      if(played && played.catch) played.catch(soundHint);
    }catch(e){ soundHint(); }
  }

  /* ── Live sync with the phone remote ────────────────────── */
  var linkEl = document.getElementById("link");

  function applyRemote(remote){
    if(!remote || typeof remote !== "object") return;
    if(remote.rev === sync.ownRev) return;             // our own change, echoed

    if(typeof remote.title === "string") state.title = remote.title;
    if(typeof remote.seal === "string") state.seal = remote.seal;
    if(Array.isArray(remote.teams)){
      remote.teams.slice(0, NP).forEach(function(t, i){
        if(!t) return;
        if(typeof t.name === "string") state.teams[i].name = t.name;
        if(typeof t.roster === "string") state.teams[i].roster = t.roster;
      });
    }

    // Collect what actually moved, so a whole round lands as one flourish
    // and an echo of our own edit does not replay the animation.
    var landed = [];
    if(Array.isArray(remote.scores)){
      remote.scores.slice(0, NT).forEach(function(row, r){
        if(!Array.isArray(row)) return;
        row.slice(0, NP).forEach(function(v, c){
          var value = (typeof v === "number" && v >= 0 && v <= limitFor(r)) ? v : null;
          if(state.scores[r][c] !== value){
            state.scores[r][c] = value;
            if(value !== null) landed.push(cells[r][c]);
          }
        });
      });
    }

    syncEditables();
    syncHome();
    render();

    if(!REDUCED){
      landed.forEach(function(btn){
        btn.classList.remove("stamped");
        void btn.offsetWidth;
        btn.classList.add("stamped");
      });
    }
    // One sound for the round, however many scores it carried.
    if(landed.length) playStamp();
  }

  // Never overwrite a field somebody on this machine is part-way through typing.
  function syncEditables(){
    if(document.activeElement !== titleEl) titleEl.textContent = state.title;
    if(document.activeElement !== sealEl) sealEl.textContent = state.seal;
    cards.forEach(function(card, i){
      var nameEl = card.querySelector(".team-name");
      var rosterEl = card.querySelector(".roster");
      if(document.activeElement !== nameEl){
        nameEl.textContent = state.teams[i].name;
        headEls[i].textContent = state.teams[i].name || TEAMS[i].name;
      }
      if(document.activeElement !== rosterEl){
        rosterEl.textContent = players(state.teams[i].roster).join(", ");
        rosterEl.classList.toggle("is-empty", !state.teams[i].roster);
      }
    });
  }

  function setLink(on, lost){
    sync.on = on;
    linkEl.hidden = !on;
    if(on) linkEl.setAttribute("data-state", lost ? "lost" : "live");
    linkEl.textContent = lost ? "Reconnecting" : "Remote linked";
  }

  function openStream(){
    var es = new EventSource("api/events");
    es.onmessage = function(ev){
      setLink(true, false);
      try{ applyRemote(JSON.parse(ev.data)); }catch(e){}
    };
    es.onerror = function(){ setLink(true, true); };   // EventSource retries
  }

  // Only look for a server when one could exist; a page opened from disk, or
  // embedded somewhere that blocks the request, quietly stays standalone.
  if(/^https?:$/.test(location.protocol)){
    fetch("api/state", { cache:"no-store" })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("no server")); })
      .then(function(remote){
        setLink(true, false);
        applyRemote(remote);
        openStream();
      })
      .catch(function(){});
  }

  setView(state.scores.some(function(row){
    return row.some(function(v){ return v !== null; });
  }) ? "board" : "home");

  render();
})();
</script>
</body>
</html>
